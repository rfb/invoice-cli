[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-invoice-cli"
version = "0.1.0"
description = "Local SQLite invoicing with a CSV editor and PDF exports"
requires-python = ">=3.11"
dependencies = ["reportlab>=4,<5"]
license = {text = "MIT"}
readme = "README.md"

[project.optional-dependencies]
test = ["pypdf>=5,<7"]

[project.scripts]
invoice = "invoice_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invoice_cli = ["fonts/*"]
